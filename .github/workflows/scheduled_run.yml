name: Scheduled GitHub Agent Issue Triage

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  triage-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Poller
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.TARGET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ingest_issues.py

      - name: Run Pipeline Triage & Slack Alerts
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.TARGET_REPO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python -c "from pipeline import fetch_pending_issues, process_issue_with_dlq; issues = fetch_pending_issues(); [process_issue_with_dlq(i) for i in issues]" || true